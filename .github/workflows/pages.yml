name: Build & deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Save compiled demo for review
        uses: actions/upload-artifact@v4
        with:
          name: lijiang-demo-dist
          path: dist
          retention-days: 14
      - name: Check and configure Pages publishing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Current Pages build mode:"
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{build_type: .build_type, source: .source}' || true
          echo "Attempting GitHub Actions publishing (needs Pages + Administration write permissions):"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true
          echo "Pages build mode after attempt:"
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{build_type: .build_type, source: .source}' || true
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
