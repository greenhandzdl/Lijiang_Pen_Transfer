name: Build & deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify artwork native sizes and lossless encoding
        run: npm run verify:assets
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Save compiled demo for review
        uses: actions/upload-artifact@v4
        with:
          name: lijiang-demo-dist
          path: dist
          retention-days: 14
      - name: Show Pages publishing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{build_type: .build_type, source: .source}'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed HTML and resources with curl
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking deployed site: ${PAGE_URL}"
          curl --fail-with-body --location --retry 7 --retry-delay 5 --retry-all-errors \
            --silent --show-error "${PAGE_URL}" -o /tmp/lijiang-page.html
          if ! grep -q '/Lijiang_Pen_Transfer/assets/index-' /tmp/lijiang-page.html; then
            echo "::error::HTML does not reference Vite compiled assets"
            head -c 600 /tmp/lijiang-page.html
            exit 1
          fi
          JS_PATH="$(grep -oE '/Lijiang_Pen_Transfer/assets/index-[^"]+\.js' /tmp/lijiang-page.html | head -1)"
          echo "Checking JS: ${JS_PATH}"
          curl --fail-with-body --location --retry 7 --retry-delay 5 --retry-all-errors \
            --silent --show-error "https://greenhandzdl.github.io${JS_PATH}" -o /dev/null
          echo "Checking all eight full-resolution artwork assets"
          for NAME in scene-day scene-dusk scene-night hero-front hero-side hero-back hero-walk hero-song; do
            FILE="/tmp/${NAME}.webp"
            curl --fail-with-body --location --retry 5 --retry-delay 3 --retry-all-errors \
              --silent --show-error "${PAGE_URL%/}/art/${NAME}.webp" -o "${FILE}"
            SIZE="$(stat -c %s "${FILE}")"
            if [[ "${SIZE}" -lt 200000 ]]; then
              echo "::error::Suspiciously small artwork: ${NAME} (${SIZE} bytes)"
              exit 1
            fi
            echo "OK ${NAME}.webp: ${SIZE} bytes"
          done
          echo "HTTP smoke test passed"
